<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <defs>
    <linearGradient id="logicoreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main container with rounded background -->
  <rect x="20" y="20" width="160" height="160" rx="20" fill="url(#logicoreGradient)" opacity="0.1" stroke="url(#logicoreGradient)" stroke-width="2"/>
  
  <!-- Core/Center circle -->
  <circle cx="100" cy="100" r="35" fill="url(#logicoreGradient)" opacity="0.2"/>
  
  <!-- Main checkmark/logic symbol -->
  <g transform="translate(100, 100)">
    <!-- Left line -->
    <line x1="-25" y1="0" x2="-10" y2="15" stroke="url(#logicoreGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right line -->
    <line x1="-10" y1="15" x2="25" y2="-15" stroke="url(#logicoreGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Circular nodes -->
    <circle cx="-25" cy="0" r="4" fill="url(#logicoreGradient)"/>
    <circle cx="-10" cy="15" r="4" fill="url(#logicoreGradient)"/>
    <circle cx="25" cy="-15" r="4" fill="url(#logicoreGradient)"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="url(#logicoreGradient)">LogiCore</text>
</svg>
